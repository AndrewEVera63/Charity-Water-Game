<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charity::Water Game</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game-container">
<img src="logoheader.png" alt="Water Quest Logo" class="header-logo">
    <h1> Water Quest </h1>

    <div class="stats">
        <div>Score: <span id="score">0</span></div>
        <div>Lives: <span id="lives">3</span></div>
    </div>

    <div id="message">
        Collect water drops and avoid pollution!
    </div>

    <div id="gameArea">

        <!-- Lane Markers -->
        <div class="lane lane1"></div>
        <div class="lane lane2"></div>

        <!-- Player -->
        <div id="player">
            <img src="logo.png" alt="charity: water Jerry Can">
        </div>

        <!-- Win/Lose Overlay -->
        <div id="overlay" class="hidden">
            <div id="overlayContent"></div>
        </div>

    </div>

    <button id="startBtn">Start Game</button>
    
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
